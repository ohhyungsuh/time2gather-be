server:
  port: ${PORT:8080}
  # Firebase Hosting/Cloud Run의 X-Forwarded-* 헤더를 신뢰한다.
  forward-headers-strategy: framework

spring:
  application:
    name: time2gather

  # Spring AI Configuration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:dummy-key}
      base-url: ${OPENAI_API_BASE:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4}
          temperature: 0.7
    mcp:
      server:
        name: time2gather
        version: 1.0.0
        type: SYNC
        # Streamable HTTP for PlayMCP compatibility (단일 /mcp 엔드포인트)
        # Valid values: SSE, STREAMABLE, STATELESS
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp
        annotation-scanner:
          enabled: true
          base-packages: com.cover.time2gather.api.mcp
        instructions: "Time2Gather는 모임 일정 조율 서비스입니다. 모임 생성, 시간 투표, 장소 투표, 일정 확정 등의 기능을 제공합니다."

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
        enable_lazy_load_no_trans: true

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/time2gather?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:local-development-secret-must-be-at-least-256-bits-long}
  expiration-ms: ${JWT_EXPIRATION_MS:31536000000}

# Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    disable-swagger-default-url: true
    display-request-duration: true
    csrf:
      enabled: false
    tryItOutEnabled: true

# AI Provider Configuration
ai:
  provider: ${AI_PROVIDER:openai}  # openai, anthropic, ollama


# Legacy OpenAI Config (for backward compatibility)
openai:
  api-key: ${OPENAI_API_KEY:dummy-key}
  api-base: ${OPENAI_API_BASE:https://api.openai.com}
  model: ${OPENAI_MODEL:gpt-4}

# Actuator (Health Check)
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true

# Logging
logging:
  level:
    root: INFO
    com.cover.time2gather: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.springframework.web.servlet.resource: ERROR
    org.springframework.security.web: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%t] %-40.40logger{39} : %m%n%wEx"
