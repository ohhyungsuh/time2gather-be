name: Deployment To AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/time2gather-be:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/time2gather-be:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          ADMIN_KAKAO_EMAILS: ${{ secrets.ADMIN_KAKAO_EMAILS }}
        with:
          host: ${{ secrets.HOST_PROD }}
          username: ubuntu
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          envs: ADMIN_KAKAO_EMAILS
          script: |
            set -eu
            test -n "$ADMIN_KAKAO_EMAILS"

            compose_file=""
            compose_override=""
            for candidate in compose.yaml compose.yml docker-compose.yaml docker-compose.yml; do
              if [ -f "$candidate" ]; then
                compose_file="$candidate"
                break
              fi
            done

            case "$compose_file" in
              compose.yaml) compose_override="compose.override.yaml" ;;
              compose.yml) compose_override="compose.override.yml" ;;
              docker-compose.yaml) compose_override="docker-compose.override.yaml" ;;
              docker-compose.yml) compose_override="docker-compose.override.yml" ;;
              *) echo "Docker Compose file not found" >&2; exit 1 ;;
            esac

            admin_override=".time2gather-admin.compose.yml"
            cat > "$admin_override" <<'EOF'
            services:
              backend:
                environment:
                  ADMIN_KAKAO_EMAILS: ${ADMIN_KAKAO_EMAILS:?ADMIN_KAKAO_EMAILS is required}
            EOF

            set -- -f "$compose_file"
            if [ -f "$compose_override" ]; then
              set -- "$@" -f "$compose_override"
            fi
            set -- "$@" -f "$admin_override"

            echo "${{ secrets.DOCKER_ACCESS_TOKEN }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
            docker compose "$@" pull backend
            docker compose "$@" up -d --force-recreate backend
            docker compose "$@" exec -T backend sh -c 'test -n "$ADMIN_KAKAO_EMAILS"'
            docker image prune -a -f
            docker compose "$@" ps
